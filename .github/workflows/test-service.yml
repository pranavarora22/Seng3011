name: Test Service CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-html ruff mypy types-requests boto3-stubs weasyprint

      - name: Lint with Ruff
        run: ruff check . --output-format=github

      - name: Type check
        run: mypy . --ignore-missing-imports --exclude tests/

      - name: Run tests with coverage and HTML report
        env:
          LOCAL_MOCK: "True"
        run: |
          mkdir -p test-results
          python -m pytest tests/ -v \
            --tb=short \
            --html=test-report.html \
            --self-contained-html \
            --junitxml=test-results/junit.xml \
            --cov=. \
            --cov-report=xml \
            --cov-report=term \
            --cov-fail-under=85

      - name: Convert test report to PDF
        if: always()
        run: weasyprint test-report.html test-report.pdf

      - name: Upload PDF test report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-pdf
          path: test-report.pdf

      - name: Upload HTML test report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-html
          path: test-report.html

      - name: Upload JUnit test report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-xml
          path: test-results/junit.xml

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Build Lambda zip
        run: ./build.sh

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve
