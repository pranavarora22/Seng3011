name: Test Service CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-html ruff mypy types-requests boto3-stubs weasyprint

      - name: Lint with Ruff
        run: ruff check . --output-format=github

      - name: Type check
        run: mypy . --ignore-missing-imports --exclude tests/

      - name: Run tests with coverage and HTML report
        env:
          LOCAL_MOCK: "True"
        run: |
          mkdir -p test-results
          python -m pytest tests/ -v \
            --tb=short \
            --html=test-report.html \
            --self-contained-html \
            --junitxml=test-results/junit.xml \
            --cov=. \
            --cov-report=xml \
            --cov-report=term \
            --cov-fail-under=85

      - name: Convert test report to PDF
        if: always()
        run: |
          python3 - <<'EOF'
          import re
          html = open("test-report.html").read()
          html = re.sub(r"<script[^>]*>.*?</script>", "", html, flags=re.DOTALL)
          override = """<style>
            input[type="checkbox"], label { display: none !important; }
            tr, tbody tr { display: table-row !important; }
            .col-links { display: none !important; }
          </style>"""
          html = html.replace("</head>", override + "</head>")
          open("test-report-print.html", "w").write(html)
          EOF
          weasyprint test-report-print.html test-report.pdf

      - name: Upload PDF test report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-pdf
          path: test-report.pdf

      - name: Upload HTML test report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-html
          path: test-report.html

      - name: Upload JUnit test report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-xml
          path: test-results/junit.xml

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml