name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test + Lint + Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov coverage flake8 mypy types-requests boto3-stubs pytest-html weasyprint

      - name: Lint code
        run: flake8 backend --max-line-length=120 --exclude=backend/tests/test_analytical_live.py,backend/tests/test_retrieval_live.py

      - name: Type check
        run: mypy backend --ignore-missing-imports --exclude backend/tests/

      - name: Run tests with coverage and JUnit output
        run: |
          mkdir -p backend/test-results
          export LOCAL_MOCK=True
          pytest backend/tests/ -v \
            --ignore=backend/tests/test_analytical_live.py \
            --ignore=backend/tests/test_retrieval_live.py \
            --junitxml=backend/test-results/junit.xml \
            --html=backend/test-report.html \
            --self-contained-html \
            --cov=backend --cov-report=xml:backend/coverage.xml --cov-report=term --cov-fail-under=85

      - name: Convert test report to PDF
        if: always()
        run: |
          python3 - <<'EOF'
          import re, os, sys
          if not os.path.exists("backend/test-report.html"):
            print("test-report.html not found, skipping PDF conversion")
            sys.exit(0)
          html = open("backend/test-report.html").read()
          html = re.sub(r"<script[^>]*>.*?</script>", "", html, flags=re.DOTALL)
          override = """<style>
            input[type="checkbox"], label { display: none !important; }
            tr, tbody tr { display: table-row !important; }
            .col-links { display: none !important; }
          </style>"""
          html = html.replace("</head>", override + "</head>")
          open("backend/test-report-print.html", "w").write(html)
          EOF
          if [ -f backend/test-report-print.html ]; then
            weasyprint backend/test-report-print.html backend/test-report.pdf
          fi

      - name: Upload PDF test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-pdf
          path: backend/test-report.pdf

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml