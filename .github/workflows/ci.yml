name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test + Lint + Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov coverage flake8 mypy types-requests boto3-stubs

      - name: Lint code
        run: flake8 . --max-line-length=120

      - name: Type check
        run: mypy . --ignore-missing-imports --exclude tests/

      - name: Run tests with coverage and JUnit output
        run: |
          mkdir -p test-results
          export LOCAL_MOCK=True
          pytest tests/ -v --junitxml=test-results/junit.xml --cov=. --cov-report=xml --cov-report=term --cov-fail-under=85

      - name: Upload test report artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/junit.xml

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
